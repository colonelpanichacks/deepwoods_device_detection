[env:seeed_xiao_esp32s3]
platform    = espressif32
board       = seeed_xiao_esp32s3
framework   = arduino
lib_deps    = h2zero/NimBLE-Arduino , meshtastic/Meshtastic

; ── Add these two lines ────────────────────────────────────────────────
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
